name: BMS CI Pipeline

on:
  push:
    branches: [ "bms/login", "main" ]
    paths:
      - 'bms/**'
  pull_request:
    branches: [ "bms/login", "main" ]
    paths:
      - 'bms/**'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bms/budget_service

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: budgetpro_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django

    - name: Run Tests
      env:
        SECRET_KEY: test_secret_key
        DEBUG: True
        DATABASE_URL: postgres://postgres:password@localhost:5432/budgetpro_db
        # Mock auth service for tests
        AUTH_SERVICE_URL: http://localhost:8001
      run: |
        python manage.py test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bms/frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: bms/frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Lint Code
      run: npm run lint
      
    - name: Build Test
      run: npm run build